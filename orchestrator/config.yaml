# eduSRC Scanner 全局配置
# ─────────────────────────────

# --- 调度 ---
scheduler:
  max_concurrency: 10      # 全局最大并发任务数
  passive_first: true      # 先执行被动检测再执行主动验证

# --- 限速 ---
rate_limit:
  default_qps: 5           # 默认每秒请求数
  night_qps: 10            # 凌晨窗口放宽
  night_window: [2, 6]     # 凌晨窗口 [start_hour, end_hour]

# --- HTTP ---
http:
  timeout: 15              # 请求超时(秒)
  user_agent: "Mozilla/5.0 (compatible; eduSRC-Scanner/0.1; +https://github.com/nwymb/edusrc-scanner)"
  max_redirects: 3
  retry: 2                 # 失败重试次数

# --- 范围 ---
scope:
  allowed_suffixes:        # 允许的目标域名后缀
    - .edu.cn
    - .edu
    - .ac.cn
    - .gov.cn               # 人社部等
  allowed_keywords:         # 机构关键字（ICP 备案反查时）
    - "大学"
    - "学院"
    - "教育"
    - "学校"
    - "中科院"
    - "人社"

# --- 日志 ---
logging:
  audit_file: "data/audit.log"
  level: "INFO"
